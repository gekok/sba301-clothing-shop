spring.application.name=sba301-ecommerce

# ===== DataSource (SQL Server) =====
# Local dev: thay username + password bằng tài khoản SQL Server của máy mình.
# Tuyệt đối KHÔNG commit credentials thật lên git.
spring.datasource.url=jdbc:sqlserver://localhost:1433; DatabaseName=sba301_ecommerce; encrypt=true; trustServerCertificate=true;
spring.datasource.username=YOUR_DB_USERNAME
spring.datasource.password=YOUR_DB_PASSWORD
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ===== JPA / Hibernate =====
# dev only — production switch to Flyway/Liquibase
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# ===== Server =====
server.port=8080
server.servlet.context-path=/api

# ===== Springdoc / Swagger UI =====
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ===== Actuator (dev) =====
management.endpoints.web.exposure.include=health,info

# ===== Custom app config =====
# Generate a random 256-bit base64 secret, e.g. via:
#   openssl rand -base64 64
app.jwt.secret=CHANGE_ME_TO_RANDOM_BASE64_256BIT_SECRET
app.jwt.expiration-ms=86400000
